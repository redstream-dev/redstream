%YAML:1.0
# SPDX-License-Identifier: MIT
# rdstracker (nvtracker's ll-config-file): an IOU tracker, greedy matching on each target's last box, no motion
# model. Tuned on a 720p street clip with YOLO11n detections; keys left out keep their defaults.
BaseConfig:
  # detections below this confidence are dropped before association
  minDetectorConfidence: 0.25

TargetManagement:
  maxTargetsPerStream: 150
  # a new target needs IOU below this against every existing target
  minIouDiff4NewTarget: 0.5
  # frames a new target is tracked before it is reported and gets its ID
  probationAge: 3
  # frames an unmatched target is kept (not reported) before it ends
  maxShadowTrackingAge: 30
  earlyTerminationAge: 1

DataAssociator:
  associationMatcherType: 0
  checkClassMatch: 1
  minMatchingScore4Overall: 0.2
  minMatchingScore4SizeSimilarity: 0.3
  minMatchingScore4Iou: 0.1
  matchingScoreWeight4SizeSimilarity: 0.4
  matchingScoreWeight4Iou: 0.6
