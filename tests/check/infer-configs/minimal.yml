# The same config as minimal.txt, in YAML: both must load to equal structs.
property:
  onnx-file: model.onnx
  labelfile-path: labels-3.txt
  num-detected-classes: 3
  batch-size: 2
  interval: 1
  gie-unique-id: 3
  net-scale-factor: 0.00392156862745098
  offsets: [1.5, 2.5, 3.5]
  model-color-format: 1
  infer-dims: [3, 640, 640]
  network-mode: 2
  maintain-aspect-ratio: 1
  symmetric-padding: true
  output-tensor-meta: false
  cluster-mode: 2
  parse-bbox-func-name: RdsInferParseYolo
  filter-out-class-ids:
    - 0
    - 2
  output-blob-names: [output0]
class-attrs-all:
  pre-cluster-threshold: 0.3
  nms-iou-threshold: 0.5
  topk: 100
class-attrs-1:
  post-cluster-threshold: 0.6
